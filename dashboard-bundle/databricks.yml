# Separate native dashboard bundle; leaves existing databricks.yml and App untouched.
bundle:
  name: armament-sca-dashboard-poc

variables:
  warehouse_id:
    description: SQL warehouse ID with access to dashboard datasets

resources:
  dashboards:
    armament_micap_poc:
      display_name: "Armament Supply Chain | MICAP Analysis (SYNTHETIC POC)"
      file_path: ./dashboards/armament_micap_poc.lvdash.json
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false

targets:
  dev:
    default: true
    mode: development

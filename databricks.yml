bundle:
  name: armament-sca

# Follows UMW's AppKit Databricks Apps bundle structure.
# Attach approved Model Serving/other resources only after verifying permissions.
resources:
  apps:
    app:
      name: armament-sca
      description: Armament Supply Chain & AM Candidate Analysis
      source_code_path: ./
      lifecycle:
        started: true

# Target host is deliberately supplied at validation/deployment time. Never
# reuse another application's workspace address without explicit confirmation.
variables:
  workspace_host:
    description: Approved Armament SCA development workspace URL

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: ${var.workspace_host}
